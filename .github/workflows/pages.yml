name: Validate and deploy portfolio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Install isolated test browser
        run: npx playwright install --with-deps chromium
      - name: Install Korean sharing-card font
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Browser regression checks
        run: npm run test:e2e
      - name: Build for local checks
        if: github.event_name == 'pull_request' || github.ref_type != 'branch' || github.ref_name != github.event.repository.default_branch
        run: npm run build
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - name: Build for Pages
        if: github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
        run: npm run build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - name: Upload dist only
        if: github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
